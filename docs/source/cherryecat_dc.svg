  <g id="text_26">
   <text style="fill: #172c48; font: 700 20px 'Noto Sans CJK JP'; text-anchor: middle" x="594" y="38.7424" transform="rotate(-0 594 38.7424)">CherryECAT：从站 shift time = 0 的稳态时序</text>
  </g>
  <g id="text_27">
   <text style="fill: #172c48; font: 12px 'Noto Sans CJK JP'; text-anchor: middle" x="594" y="54.4896" transform="rotate(-0 594 54.4896)">周期 T = 1000 μs；所有从站相移为 0；主站提前量 200 μs；主站周期函数进入时刻为 x。</text>
  </g>
  <g id="text_28">
   <text style="fill: #8795a8; font: 11px 'Noto Sans CJK JP'; text-anchor: middle" x="594" y="82.368" transform="rotate(-0 594 82.368)">假设：整个 ec_master_period_process() 除全部 PDO callback 外，其他处理总耗时为 20 μs。</text>
  </g>
  <g id="text_29">
   <text style="fill: #dc731b; font: 12px 'Noto Sans CJK JP'; text-anchor: middle" x="594" y="510.048" transform="rotate(-0 594 510.048)">800 μs 的通信对应下一次 1000 μs 的 SYNC0，而不是已经过去的 0 μs SYNC0。</text>
  </g>
  <g id="text_30">
   <text style="fill: #245edb; font: 12px 'Noto Sans CJK JP'; text-anchor: middle" x="594" y="540.4608" transform="rotate(-0 594 540.4608)">给定本轮进入时刻 x：Pmax = 1000 − 200 − x − 20 = 780 μs − x。实际预算应低于此理论值。</text>
  </g>
  <g id="text_31">
   <text style="fill: #8795a8; font: 10px 'Noto Sans CJK JP'; text-anchor: middle" x="594" y="568.3392" transform="rotate(-0 594 568.3392)">此式按图示 0～1000 μs 窗口计算，结果须为正；不是把从站相移 0 直接代入而得到负预算。</text>
  </g>
  <g id="text_32">
   <text style="fill: #8795a8; font: 10px 'Noto Sans CJK JP'; text-anchor: middle" x="594" y="592.416" transform="rotate(-0 594 592.416)">灰色两段仅示意其他处理可分布在回调前后，总计 20 μs；图示将窗口末端与 FRMW 采样目标对齐。</text>
  </g>
  <g id="text_33">
   <text style="fill: #8795a8; font: 10px 'Noto Sans CJK JP'; text-anchor: middle" x="594" y="617.1264" transform="rotate(-0 594 617.1264)">PI 重新锁相后 x 可改变；未计入的 MAC/链路偏移、从站准备和抖动须另留余量。图示为稳态，不是上电启动过程。</text>
  </g>
